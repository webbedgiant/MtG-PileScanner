<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MTG Pile Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1423;--panel:#171e33;--line:#2a3452;--txt:#e8ecf8;--mut:#8b96b8;--acc:#5b8cff;--ok:#2ecc71;--warn:#f39c12;--bad:#e74c3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.tabs button{background:none;border:0;color:var(--mut);padding:8px 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--txt);border-color:var(--acc)}
.pill{font-size:12px;color:var(--mut)}.spacer{flex:1}
button,select,input[type=number],input[type=text]{background:#222b47;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{background:#2b3659}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
main{padding:14px 18px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.stage{position:relative;background:#000;border-radius:8px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage canvas{max-width:100%;max-height:70vh;display:block}.stage video{display:none}
#drop{position:absolute;color:var(--mut);pointer-events:none;text-align:center;padding:20px}
.stage.over{outline:2px dashed var(--acc)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row img{width:44px;border-radius:4px;background:#000}.row .n{font-weight:600}.row .s{color:var(--mut);font-size:12px}
.qty{display:flex;gap:4px;align-items:center}.qty input{width:52px}
.badge{font-size:11px;border-radius:10px;padding:1px 7px;margin-left:6px;background:var(--warn);color:#000}
.x{color:var(--bad);background:none;border:0;font-size:16px}
#pendList{max-height:56vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#1f2842}.tw{max-height:62vh;overflow:auto;margin-top:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222b47;border:1px solid var(--line);padding:10px 16px;border-radius:8px;display:none;max-width:80vw}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:160px;display:none}.bar i{display:block;height:100%;background:var(--acc);width:0}
.hidden{display:none!important}
.mr{display:flex;gap:8px;align-items:center;padding:4px 6px;cursor:pointer;border-radius:6px}.mr:hover{background:#222b47}.mr img{width:30px;border-radius:3px}
#mres{margin-bottom:6px}#peek{position:fixed;z-index:50;width:260px;border-radius:12px;display:none;pointer-events:none;box-shadow:0 8px 30px #000}
th[data-col]:hover{background:#2b3659}
</style></head><body>
<header>
  <h1>🃏 MTG Pile Scanner <span class="pill">v1.9</span></h1>
  <div class="tabs"><button class="on" data-tab="scan">Scan</button><button data-tab="coll">Collection</button></div>
  <div class="spacer"></div>
  <div class="bar" id="bar"><i></i></div>
  <span class="pill" id="artStatus"></span><button id="btnArt" class="hidden"></button>
  <span class="pill" id="dbStatus">Starting…</span>
  <button id="btnUpdate" title="Check Scryfall for new sets now">Check for new sets</button><button id="btnQuit" title="Stop the scanner">⏻ Quit</button>
</header>
<div id="errBar" class="hidden" style="background:#5a1f1f;border-bottom:1px solid #a33;padding:10px 18px;white-space:pre-wrap;user-select:text"></div>
<main>
<section id="tab-scan"><div class="grid">
  <div class="panel">
    <div class="toolbar">
      <button id="btnUpload">📁 Upload images…</button><input id="file" type="file" accept="image/*" multiple hidden>
      <button id="btnCam">📷 Start webcam</button><select id="camSel" class="hidden"></select>
      <label><input type="checkbox" id="useArt" checked> Also match by card art</label>
      <label><input type="checkbox" id="thorough"> Thorough (also reads sideways/upside-down cards; slower)</label>
    </div>
    <div class="stage" id="stage"><canvas id="view" width="16" height="9"></canvas><video id="video" playsinline muted></video>
      <div id="drop">Drop photos of your pile here<br>or start the webcam</div></div>
    <div class="toolbar">
      <button id="btnScan" class="primary" disabled>Scan current frame</button>
      <button id="btnLive" disabled>▶ Live scan</button>
      <label>every <input id="interval" type="number" min="1" max="60" value="4" style="width:60px"> s</label>
      <span class="pill" id="scanStatus"></span>
    </div>
    <div class="pill">Tip: fan or spread cards so each card's title bar is visible and well lit. Green = confident, orange = please check. Press Space to scan the current frame.</div>
  </div>
  <div class="panel">
    <h2>Detected cards <span class="pill" id="pendCount"></span></h2>
    <input id="msearch" type="text" placeholder="Missed one? Type a card name to add it…" style="width:100%"><div id="mres"></div>
    <div id="pendList"></div>
    <div class="toolbar"><button id="btnAddAll" class="primary">Add all to collection</button><button id="btnClearPending">Clear</button><button id="btnUndo" disabled title="Undo the last Add">↶ Undo last add</button></div>
  </div>
</div></section>

<section id="tab-coll" class="hidden"><div class="panel">
  <div class="toolbar">
    <b id="collSummary"></b><div class="spacer"></div>
    <input id="filter" type="text" placeholder="Filter…">
    <button id="btnCopy">📋 Copy table</button><button id="btnDeck" title="Moxfield / Archidekt import format">📋 Copy decklist</button>
    <a href="/api/export.xlsx"><button>⬇ .xlsx</button></a><a href="/api/export.csv"><button>⬇ .csv</button></a>
    <button id="btnClearColl">Clear collection</button>
  </div>
  <div class="toolbar"><span class="pill">Auto-saved spreadsheet:</span><input id="exportPath" type="text" style="flex:1;min-width:260px"><button id="btnSavePath">Save path</button><button id="btnFolder" title="Open the folder with your database, backups and spreadsheet">📂 Data folder</button></div>
  <div class="pill" id="exportMsg"></div>
  <div class="tw"><table id="collTable"></table></div>
</div></section>
</main><div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok){let m;try{m=(await r.json()).detail}catch{}throw new Error(m||r.statusText)}return r.json()}
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}

// ---------- tabs & status ----------
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#tab-scan').classList.toggle('hidden',b.dataset.tab!=='scan');$('#tab-coll').classList.toggle('hidden',b.dataset.tab!=='coll');
  if(b.dataset.tab==='coll')loadColl()});
let artBuilding=false,dbReady=false,lastErr='';
async function pollStatus(){
  try{const s=await api('/api/status');dbReady=s.ready;const u=s.update;
    $('#dbStatus').textContent=u.updating?u.message:(s.ready?`${s.cards.toLocaleString()} printings · ${u.message||'ready'}`:(u.message||'Loading…'))+(u.error&&!u.updating?' ⚠':'');
    $('#dbStatus').title=u.error||'';$('#dbStatus').style.color=(u.error&&!u.updating)?'var(--warn)':'';
    const eb=$('#errBar');eb.classList.toggle('hidden',!(u.error&&!u.updating));eb.textContent='Card data problem: '+(u.error||'');
    if(u.error&&!u.updating&&u.error!==lastErr){lastErr=u.error;toast('Card data problem: '+u.error,15000)}
    $('#btnUpdate').textContent=(!s.ready&&!u.updating)?'Retry download':'Check for new sets';
    $('.bar').style.display=u.updating?'block':'none';$('.bar i').style.width=(u.progress*100)+'%';
    $('#btnUpdate').disabled=u.updating;$('#exportPath').value=$('#exportPath').matches(':focus')?$('#exportPath').value:s.export_path;
    $('#exportMsg').textContent=s.export.message;$('#btnUndo').disabled=!s.can_undo;
    const a=s.art;artBuilding=a.building;
    $('#artStatus').textContent=a.total?`Art index ${a.size.toLocaleString()} / ${a.total.toLocaleString()}${a.building?' …building':''}`:'';
    $('#artStatus').title=a.error||'';const ab=$('#btnArt');ab.classList.toggle('hidden',!s.ready);ab.textContent=a.building?'Pause art index':'Build art index';
    updateButtons();setTimeout(pollStatus,u.updating?1500:10000)}catch{setTimeout(pollStatus,4000)}}
$('#btnArt').onclick=async()=>{await api(artBuilding?'/api/art/stop':'/api/art/start',{method:'POST'});setTimeout(pollStatus,500)};
$('#btnUpdate').onclick=async()=>{await api('/api/update',{method:'POST'});pollStatus()};

// ---------- viewer ----------
const view=$('#view'),vctx=view.getContext('2d'),video=$('#video');
let mode='none',imgSrc=null,dets=[],stream=null,live=false,busy=false,raf=0;
function updateButtons(){const ok=dbReady&&mode!=='none';$('#btnScan').disabled=!ok||busy;$('#btnLive').disabled=!(dbReady&&mode==='cam')}
function paint(){
  let w,h,src;
  if(mode==='image'&&imgSrc){w=imgSrc.width;h=imgSrc.height;src=imgSrc}
  else if(mode==='cam'&&video.videoWidth){w=video.videoWidth;h=video.videoHeight;src=video}else return;
  if(view.width!==w||view.height!==h){view.width=w;view.height=h}
  vctx.drawImage(src,0,0);
  const lw=Math.max(2,w/450),fs=Math.max(12,w/75);vctx.lineWidth=lw;vctx.font=`600 ${fs}px Segoe UI,sans-serif`;
  for(const d of dets){const[x,y,bw,bh]=d.box,ok=d.score>=95&&d.verified;
    vctx.strokeStyle=ok?'#2ecc71':'#f39c12';vctx.strokeRect(x,y,bw,bh);
    const label=d.name.length>24?d.name.slice(0,23)+'…':d.name,tw=vctx.measureText(label).width+8;
    vctx.fillStyle='rgba(15,20,35,.88)';vctx.fillRect(x,y,tw,fs+6);vctx.fillStyle='#fff';vctx.fillText(label,x+4,y+fs)}}
function loop(){if(mode==='cam'){paint();raf=requestAnimationFrame(loop)}}
function stopCam(){live=false;$('#btnLive').textContent='▶ Live scan';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}cancelAnimationFrame(raf);$('#btnCam').textContent='📷 Start webcam';$('#camSel').classList.add('hidden')}

// ---------- upload ----------
$('#btnUpload').onclick=()=>$('#file').click();
$('#file').onchange=e=>{handleFiles([...e.target.files]);e.target.value=''};
const stage=$('#stage');
stage.ondragover=e=>{e.preventDefault();stage.classList.add('over')};stage.ondragleave=()=>stage.classList.remove('over');
stage.ondrop=e=>{e.preventDefault();stage.classList.remove('over');handleFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')))};
async function handleFiles(files){
  if(!files.length)return;stopCam();
  if(!dbReady)toast('The card database is not loaded yet, so images can be shown but not scanned. Wait for the top-right status to show a card count (or click Retry download).',9000);
  for(let i=0;i<files.length;i++){
    const fk=`${files[i].name}|${files[i].size}|${files[i].lastModified}`;
    if(scannedFiles.has(fk)&&!confirm(`"${files[i].name}" was already scanned this session. Scan it again and add its cards again?`))continue;
    scannedFiles.add(fk);
    imgSrc=await createImageBitmap(files[i]);mode='image';dets=[];$('#drop').classList.add('hidden');paint();
    $('#scanStatus').textContent=`Scanning image ${i+1} of ${files.length}…`;
    await doScan(files[i],'sum')}
  $('#scanStatus').textContent=`Done: ${files.length} image(s) scanned`}
$('#btnScan').onclick=async()=>{if(mode==='image'){const b=await new Promise(r=>{const c=document.createElement('canvas');c.width=imgSrc.width;c.height=imgSrc.height;c.getContext('2d').drawImage(imgSrc,0,0);c.toBlob(r,'image/jpeg',.95)});await doScan(b,'sum')}else if(mode==='cam')await scanFrame('sum')}

// ---------- webcam ----------
async function startCam(id){
  stopCam();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined,width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){toast('Webcam unavailable: '+e.message);return}
  video.srcObject=stream;await video.play();mode='cam';dets=[];$('#drop').classList.add('hidden');
  $('#btnCam').textContent='⏹ Stop webcam';
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),sel=$('#camSel');
  sel.innerHTML=devs.map(d=>`<option value="${esc(d.deviceId)}">${esc(d.label||'Camera')}</option>`).join('');
  sel.value=stream.getVideoTracks()[0].getSettings().deviceId||'';sel.classList.toggle('hidden',devs.length<2);
  loop();updateButtons()}
$('#btnCam').onclick=()=>{if(stream){stopCam();mode='none';updateButtons()}else startCam()};
$('#camSel').onchange=e=>startCam(e.target.value);
async function scanFrame(how){
  const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));return doScan(b,how)}
$('#btnLive').onclick=async()=>{
  if(live){live=false;$('#btnLive').textContent='▶ Live scan';return}
  live=true;$('#btnLive').textContent='⏸ Stop live scan';
  while(live&&mode==='cam'){await scanFrame('max');if(!live)break;
    await new Promise(r=>setTimeout(r,Math.max(1,+$('#interval').value||4)*1000))}
  live=false;$('#btnLive').textContent='▶ Live scan'};

async function doScan(blob,how){
  busy=true;updateButtons();$('#scanStatus').textContent='Scanning…';
  try{const fd=new FormData();fd.append('file',blob,'scan.jpg');fd.append('thorough',$('#thorough').checked);fd.append('use_art',$('#useArt').checked);fd.append('fast',how==='max');
    const res=await api('/api/scan',{method:'POST',body:fd});
    dets=res.detections;if(mode==='image')paint();mergePending(dets,how);
    $('#scanStatus').textContent=`${dets.length} cards found in ${res.elapsed}s`+(res.art_found?` (${res.art_found} by art)`:(($('#useArt').checked&&res.art_index<(res.art_total||1)*0.9)?` — art index ${res.art_index.toLocaleString()} of ${(res.art_total||0).toLocaleString()} built; art matching improves as it finishes`:''))}
  catch(e){$('#scanStatus').textContent='Scan failed: '+e.message;live=false}
  busy=false;updateButtons()}

// ---------- pending list ----------
const pending=new Map();
function mergePending(ds,how){
  const counts=new Map();
  for(const d of ds){const c=counts.get(d.card_id)||{...d,count:0};c.count++;counts.set(d.card_id,c)}
  for(const[id,c]of counts){let it=pending.get(id);
    if(!it){it={card_id:id,name:c.name,set_code:c.set_code,number:c.collector_number,image:c.image_url,score:c.score,verified:c.verified,method:c.method,include:c.method==='art'?c.score>=85:c.score>=95,qty:0,foil:0,printings:null};pending.set(id,it)}
    it.qty=how==='sum'?it.qty+c.count:Math.max(it.qty,c.count)}
  renderPending()}
function renderPending(){
  const items=[...pending.values()].sort((a,b)=>review(b)-review(a));
  $('#pendCount').textContent=items.length?`${items.reduce((a,i)=>a+i.qty,0)} cards · ${items.length} unique`:'';
  $('#btnAddAll').textContent=`Add ${items.filter(i=>i.include).reduce((a,i)=>a+i.qty,0)} selected to collection`;
  $('#pendList').innerHTML=items.length?items.map(i=>`<div class="row" data-id="${esc(i.card_id)}">
    <img src="${esc(i.image)}" data-img="${esc(big(i.image))}" alt="">
    <div><div class="n"><input type="checkbox" class="inc" ${i.include?'checked':''} title="Include when adding"> ${esc(i.name)}${i.method==='art'?'<span class="badge">matched by art</span>':(i.score<95?'<span class="badge">low confidence</span>':'')}${!i.verified?'<span class="badge">check printing</span>':''}</div>
    <div class="s">${i.printings?`<select class="pr">${i.printings.map(p=>`<option value="${esc(p.id)}" ${p.id===i.card_id?'selected':''}>${esc(p.set_code.toUpperCase())} #${esc(p.collector_number)} · ${esc(p.set_name)}</option>`).join('')}</select>`
      :`${esc(i.set_code.toUpperCase())} #${esc(i.number)} <a href="#" class="chg">change printing</a>`}
      <label><input type="checkbox" class="foil" ${i.foil?'checked':''}> foil</label></div></div>
    <div class="qty"><button class="m">−</button><input type="number" class="q" min="1" value="${i.qty}"><button class="p">+</button><button class="x" title="Remove">✕</button></div></div>`).join('')
    :'<div class="pill" style="padding:20px 0">Nothing detected yet. Scan an image or webcam frame.</div>'}
$('#pendList').addEventListener('click',async e=>{
  const row=e.target.closest('.row');if(!row)return;const it=pending.get(row.dataset.id);
  if(e.target.matches('.m'))it.qty=Math.max(1,it.qty-1);else if(e.target.matches('.p'))it.qty++;
  else if(e.target.matches('.x'))pending.delete(it.card_id);
  else if(e.target.matches('.chg')){e.preventDefault();it.printings=await api('/api/printings?card_id='+encodeURIComponent(it.card_id))}
  else return;renderPending()});
$('#pendList').addEventListener('change',e=>{
  const row=e.target.closest('.row');if(!row)return;const it=pending.get(row.dataset.id);
  if(e.target.matches('.q'))it.qty=Math.max(1,+e.target.value||1);
  else if(e.target.matches('.foil'))it.foil=e.target.checked?1:0;
  else if(e.target.matches('.inc'))it.include=e.target.checked;
  else if(e.target.matches('.pr')){const p=it.printings.find(x=>x.id===e.target.value);pending.delete(it.card_id);
    const ex=pending.get(p.id);if(ex){ex.qty+=it.qty}else{Object.assign(it,{card_id:p.id,set_code:p.set_code,number:p.collector_number,image:p.image_url,verified:true});pending.set(p.id,it)}}
  renderPending()});
$('#btnClearPending').onclick=()=>{pending.clear();renderPending()};
$('#btnAddAll').onclick=async()=>{
  const items=[...pending.values()].filter(i=>i.include).map(i=>({card_id:i.card_id,qty:i.qty,foil:i.foil}));if(!items.length)return;
  try{const r=await api('/api/collection/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
    for(const i of [...pending.values()])if(i.include)pending.delete(i.card_id);renderPending();pollStatus();toast(`Added ${items.reduce((a,i)=>a+i.qty,0)} cards. ${r.export.message}`,5000)}catch(e){toast('Failed: '+e.message)}};

// ---------- collection ----------
let coll=null;
async function loadColl(){coll=await api('/api/collection/table');renderColl()}
function renderColl(){
  const f=$('#filter').value.toLowerCase(),total=coll.rows.reduce((a,r)=>a+r[0],0),val=coll.rows.reduce((a,r)=>a+(r[14]||0),0);
  $('#collSummary').textContent=`${total} cards · ${coll.rows.length} unique · ~$${val.toFixed(2)}`;
  const idx=coll.rows.map((r,i)=>i).filter(i=>!f||coll.rows[i].join(' ').toLowerCase().includes(f));
  if(sortCol>=0)idx.sort((a,b)=>{const x=coll.rows[a][sortCol],y=coll.rows[b][sortCol];return(typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true}))*sortDir});
  $('#collTable').innerHTML='<tr><th></th>'+coll.columns.map((c,j)=>`<th data-col="${j}" style="cursor:pointer">${esc(c)}${sortCol===j?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>'+idx.map(i=>{const r=coll.rows[i];
    return `<tr data-i="${i}"><td><button class="m">−</button><button class="p">+</button><button class="x">✕</button></td>`+r.map((v,j)=>`<td${j===2?` data-img="${esc(big(coll.keys[i].image_url))}"`:''}>${j===16&&v?`<a href="${esc(v)}" target="_blank" style="color:var(--acc)">link</a>`:esc(v??'')}</td>`).join('')+'</tr>'}).join('')}
$('#filter').oninput=()=>coll&&renderColl();
$('#collTable').onclick=async e=>{const th=e.target.closest('th[data-col]');if(th){const c=+th.dataset.col;sortDir=(sortCol===c)?-sortDir:1;sortCol=c;renderColl();return}
  const tr=e.target.closest('tr[data-i]');if(!tr||!e.target.matches('button'))return;
  const i=+tr.dataset.i,k=coll.keys[i];let q=coll.rows[i][0];
  if(e.target.matches('.m'))q--;else if(e.target.matches('.p'))q++;else if(!confirm('Remove this card?'))return;else q=0;
  const r=await api('/api/collection/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card_id:k.card_id,foil:k.foil,qty:q})});
  $('#exportMsg').textContent=r.export.message;loadColl()};
$('#btnCopy').onclick=async()=>{
  const tsv=[coll.columns,...coll.rows].map(r=>r.map(v=>String(v??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  try{await navigator.clipboard.writeText(tsv)}catch{const t=document.createElement('textarea');t.value=tsv;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
  toast('Copied! Paste straight into Excel or Google Sheets.')};
$('#btnClearColl').onclick=async()=>{if(confirm('Delete your ENTIRE collection? This cannot be undone.')){await api('/api/collection/clear',{method:'POST'});loadColl()}};
$('#btnSavePath').onclick=async()=>{try{const r=await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({export_path:$('#exportPath').value})});
  $('#exportMsg').textContent=r.export.message;toast('Export path saved')}catch(e){toast(e.message)}};

// ---------- v1.8 additions ----------
const big=u=>(u||'').replace('/small/','/normal/');
const review=i=>(i.method==='art'||i.score<95||!i.verified)?1:0;
const scannedFiles=new Set();let sortCol=-1,sortDir=1;
const peek=document.createElement('img');peek.id='peek';document.body.append(peek);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-img]');if(t&&t.dataset.img){peek.src=t.dataset.img;peek.style.display='block'}else peek.style.display='none'});
document.addEventListener('mousemove',e=>{if(peek.style.display==='block'){peek.style.left=Math.min(e.clientX+18,innerWidth-270)+'px';peek.style.top=Math.max(8,Math.min(e.clientY-60,innerHeight-380))+'px'}});
let mst,mres=[];
$('#msearch').oninput=e=>{clearTimeout(mst);const q=e.target.value.trim();if(q.length<2){$('#mres').innerHTML='';return}
  mst=setTimeout(async()=>{try{mres=await api('/api/search?q='+encodeURIComponent(q));
    $('#mres').innerHTML=mres.map(c=>`<div class="mr" data-id="${esc(c.card_id)}"><img src="${esc(c.image_url)}" data-img="${esc(big(c.image_url))}"><span>${esc(c.name)} <span class="s pill">${esc(c.set_code.toUpperCase())} #${esc(c.collector_number)}</span></span></div>`).join('')||'<div class="pill">No match</div>'}catch{}},200)};
$('#mres').onclick=e=>{const el=e.target.closest('.mr');if(!el)return;const c=mres.find(x=>x.card_id===el.dataset.id);if(!c)return;
  let it=pending.get(c.card_id);if(!it){it={card_id:c.card_id,name:c.name,set_code:c.set_code,number:c.collector_number,image:c.image_url,score:100,verified:false,method:'manual',include:true,qty:0,foil:0,printings:null};pending.set(c.card_id,it)}
  it.qty++;renderPending();$('#msearch').value='';$('#mres').innerHTML=''};
$('#btnUndo').onclick=async()=>{try{const r=await api('/api/collection/undo',{method:'POST'});toast(`Removed ${r.removed} cards from the last add.`);if(!$('#tab-coll').classList.contains('hidden'))loadColl();pollStatus()}catch(e){toast(e.message)}};
$('#btnQuit').onclick=async()=>{if(!confirm('Stop the scanner? Your collection is saved.'))return;try{await api('/api/quit',{method:'POST'})}catch{}document.body.innerHTML='<p style="padding:40px">Scanner stopped. You can close this tab.</p>'};
$('#btnFolder').onclick=()=>api('/api/open-folder',{method:'POST'});
$('#btnDeck').onclick=async()=>{const t=coll.rows.map(r=>`${r[0]} ${r[2]} (${r[3]}) ${r[5]}${r[1]?' *F*':''}`).join('\n');
  try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}toast('Decklist copied (Moxfield / Archidekt import format).')};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)&&!$('#btnScan').disabled){e.preventDefault();$('#btnScan').click()}});

renderPending();pollStatus();
</script></body></html>
